name: Synchro Facebook → Journal de chantier
on:
  schedule:
    - cron: '7 * * * *'    # toutes les heures : une publication Facebook apparaît sur le site en moins d'1 h
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync-facebook.mjs
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Commit si nouveautés (Cloudflare redéploie automatiquement)
        run: |
          git config user.name "crm-bot"
          git config user.email "bot@crm-maconnerie.fr"
          git add data/journal.json; if [ -d src/assets/journal ]; then git add src/assets/journal; fi
          if ! git diff --cached --quiet; then git commit -m "Journal de chantier : synchro Facebook" && git push; fi
