name: Synchro Facebook → Journal de chantier
on:
  schedule:
    - cron: '17 5 * * *'   # tous les jours vers 6 h (heure de Paris)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync-facebook.mjs
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: Commit si nouveautés (Cloudflare redéploie automatiquement)
        run: |
          git config user.name "crm-bot"
          git config user.email "bot@crm-maconnerie.fr"
          git add data/journal.json src/assets/journal
          git diff --cached --quiet || git commit -m "Journal de chantier : synchro Facebook" && git push
